<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Login – Rent Locally</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <span class="logo-icon">🏠</span>
      <span class="logo-text">Rent Locally <span class="logo-vendor">Vendor</span></span>
    </a>
    <nav class="header-nav">
      <a href="index.html" class="active">Login</a>
      <a href="register.html">Register</a>
      <a href="profile.html">Profile</a>
      <a href="categories.html">Categories</a>
      <a href="#" onclick="logout(); return false;">Logout</a>
    </nav>
    <button class="nav-toggle" onclick="toggleMobileNav()" aria-label="Menu">&#9776;</button>
  </div>
</header>

<div class="page-wrap">
<div class="container">
  <div class="form-box">
    <h2>Vendor Login</h2>

    <div class="input-group">
      <label class="input-label" for="loginUser">Username or Email</label>
      <input type="text" id="loginUser" placeholder="Username or Email" required>
    </div>

    <div class="input-group">
      <label class="input-label" for="loginPass">Password</label>
      <div class="pass-input-wrap">
        <input type="password" id="loginPass" placeholder="Password" required>
      </div>
    </div>

    <p class="password-info">
      * Minimum 8 characters, must include uppercase, number &amp; special character
    </p>

    <p class="forgot">
      <a href="reset-password.html">Forgot Password?</a>
    </p>

    <button class="main-btn" onclick="login()">Sign In</button>

    <p class="login-text">
      Don't have an account?
      <a href="register.html">Register</a>
    </p>
  </div>
</div>
</div>

<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-copy">&copy; 2024 Rent Locally. All rights reserved.</span>
    <div class="footer-links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Use</a>
      <a href="#">Help &amp; Support</a>
    </div>
  </div>
</footer>

<script>
  if (typeof isAuthenticated === 'function' && isAuthenticated()) {
    window.location.href = 'profile.html';
  }
  function toggleMobileNav() {
    document.querySelector('.header-nav').classList.toggle('nav-open');
  }
</script>
<script src="script.js"></script>
</body>
</html>
