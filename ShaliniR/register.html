<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Registration – Rent Locally</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="header-logo" href="index.html">
      <span class="logo-icon">🏠</span>
      <span class="logo-text">Rent Locally <span class="logo-vendor">Vendor</span></span>
    </a>
    <nav class="header-nav">
      <a href="index.html">Login</a>
      <a href="register.html" class="active">Register</a>
      <a href="profile.html">Profile</a>
      <a href="categories.html">Categories</a>
      <a href="#" onclick="logout(); return false;">Logout</a>
    </nav>
    <button class="nav-toggle" onclick="toggleMobileNav()" aria-label="Menu">&#9776;</button>
  </div>
</header>

<div class="page-wrap">
<div class="container">
  <div class="form-box">
    <h2>Vendor Registration</h2>

    <div class="input-group">
      <label class="input-label" for="name">Full Name</label>
      <input type="text" id="name" placeholder="Full Name">
    </div>

    <div class="input-group">
      <label class="input-label" for="email">Email</label>
      <input type="email" id="email" placeholder="Email">
    </div>

    <div class="input-group">
      <label class="input-label" for="mobile">Mobile Number</label>
      <input type="text" id="mobile" placeholder="Mobile Number" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
      <button onclick="sendOTP()">Send OTP</button>
    </div>

    <div class="input-group">
      <label class="input-label" for="otp">Enter OTP</label>
      <input type="text" id="otp" placeholder="Enter OTP">
      <button onclick="verifyOTP()">Verify</button>
    </div>

    <!-- OTP Timer & Resend -->
    <div id="otpTimerSection" style="display:none; margin: -8px 0 12px 0; text-align:center;">
      <small id="otpTimerText" style="color:#666; font-size:13px;">Resend OTP in <span id="otpCountdown">60</span>s</small>
      <br>
      <button id="resendOtpBtn" onclick="resendOTP()" style="display:none; margin-top:6px; padding:6px 16px; background:#4CAF50; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:13px;">Resend OTP</button>
    </div>

    <!-- Password field with clean eye icon -->
    <div class="input-group">
      <label class="input-label" for="password">Password</label>
      <div class="pass-input-wrap">
        <input type="password" id="password" placeholder="Password">
      </div>
    </div>
    <div class="pass-validation-text" id="passValidation" style="margin-top:-10px; margin-bottom:14px;"></div>

    <!-- Confirm Password field with clean eye icon -->
    <div class="input-group">
      <label class="input-label" for="confirmPassword">Confirm Password</label>
      <div class="pass-input-wrap">
        <input type="password" id="confirmPassword" placeholder="Confirm Password" oninput="checkPasswordMatch()">
      </div>
    </div>
    <div class="pass-validation-text" id="confirmPassValidation" style="margin-top:-10px; margin-bottom:14px;"></div>

    <button class="main-btn" onclick="createAccount()" style="margin-top:8px;">Create Account</button>

    <p class="login-text">
      Already have an account?
      <a href="index.html">Login</a>
    </p>
  </div>
</div>
</div>

<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-copy">&copy; 2024 Rent Locally. All rights reserved.</span>
    <div class="footer-links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Use</a>
      <a href="#">Help &amp; Support</a>
    </div>
  </div>
</footer>

<script>
  window.addEventListener('load', function() {
    setTimeout(() => {
      if (typeof isAuthenticated === 'function' && isAuthenticated()) {
        window.location.href = 'profile.html';
      }
    }, 100);
  });

  function toggleMobileNav() {
    document.querySelector('.header-nav').classList.toggle('nav-open');
  }

  function toggleRegPassword(inputId, spanId) {
    const input = document.getElementById(inputId);
    const span = document.getElementById(spanId);
    if (input.type === 'password') {
      input.type = 'text';
      if (span) span.setAttribute('data-visible', 'true');
    } else {
      input.type = 'password';
      if (span) span.removeAttribute('data-visible');
    }
  }

  function checkPasswordStrength(pass) {
    if (!pass) return '';
    const hasUpper = /[A-Z]/.test(pass);
    const hasDigit = /\d/.test(pass);
    const hasSpecial = /[@$!%*?&]/.test(pass);
    const hasLength = pass.length >= 8;
    if (hasLength && hasUpper && hasDigit && hasSpecial) {
      return '<span class="pass-ok">&#10003; Password is strong</span>';
    }
    const missing = [];
    if (!hasLength) missing.push('8+ characters');
    if (!hasUpper) missing.push('uppercase letter');
    if (!hasDigit) missing.push('number');
    if (!hasSpecial) missing.push('special character (@$!%*?&)');
    return '<span class="pass-warn">&#10007; Needs: ' + missing.join(', ') + '</span>';
  }

  function checkPasswordMatch() {
    const pass = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const el = document.getElementById('confirmPassValidation');
    if (!confirm) { el.innerHTML = ''; return; }
    if (pass === confirm) {
      el.innerHTML = '<span class="pass-ok">&#10003; Passwords match</span>';
    } else {
      el.innerHTML = '<span class="pass-warn">&#10007; Passwords do not match</span>';
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('password').addEventListener('input', function() {
      document.getElementById('passValidation').innerHTML = checkPasswordStrength(this.value);
      checkPasswordMatch();
    });
  });
</script>
<script src="script.js"></script>
</body>
</html>
