<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>RentIT Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#5f9cff,#7b2cbf);
font-family:Arial;
}

.login-container{
background:white;
padding:40px;
border-radius:20px;
width:380px;
box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.brand{
text-align:center;
font-size:30px;
font-weight:bold;
color:#5f9cff;
margin-bottom:5px;
}

.subtitle{
text-align:center;
font-size:14px;
color:gray;
margin-bottom:25px;
}

.btn-main{
background:#5f9cff;
color:white;
font-weight:bold;
}

.btn-main:hover{
background:#4a86e8;
color:white;
}

.switch-link{
text-align:center;
margin-top:15px;
color:#5f9cff;
cursor:pointer;
font-size:14px;
}

.input-group-text{
background:#5f9cff;
color:white;
}

</style>

</head>

<body>

<div class="login-container">

<div class="brand">RentIT</div>
<div class="subtitle">Rental Management System</div>

<!-- LOGIN FORM -->

<div id="loginForm">

<h5 class="text-center mb-3">Admin Login</h5>

<form action="dashboard.html">

<div class="mb-3 input-group">
<span class="input-group-text"><i class="fa fa-envelope"></i></span>
<input type="email" class="form-control" placeholder="Enter Email">
</div>

<div class="mb-3 input-group">
<span class="input-group-text"><i class="fa fa-lock"></i></span>
<input type="password" class="form-control" placeholder="Enter Password">
</div>

<button class="btn btn-main w-100">Login</button>

</form>

<div class="switch-link" onclick="showRegister()">
Don't have an account? Register
</div>

</div>

<!-- REGISTER FORM -->

<div id="registerForm" style="display:none;">

<h5 class="text-center mb-3">Create Account</h5>

<form>

<div class="mb-3 input-group">
<span class="input-group-text"><i class="fa fa-user"></i></span>
<input type="text" class="form-control" placeholder="Full Name">
</div>

<div class="mb-3 input-group">
<span class="input-group-text"><i class="fa fa-envelope"></i></span>
<input type="email" class="form-control" placeholder="Email">
</div>

<div class="mb-3 input-group">
<span class="input-group-text"><i class="fa fa-lock"></i></span>
<input type="password" class="form-control" placeholder="Password">
</div>

<div class="mb-3 input-group">
<span class="input-group-text"><i class="fa fa-lock"></i></span>
<input type="password" class="form-control" placeholder="Confirm Password">
</div>

<button class="btn btn-main w-100" onclick="handleRegister()">Register</button>

</form>

<div class="switch-link" onclick="showLogin()">
Already have an account? Login
</div>

</div>

</div>

<script>

function showRegister(){
document.getElementById("loginForm").style.display="none";
document.getElementById("registerForm").style.display="block";
}

function showLogin(){
document.getElementById("registerForm").style.display="none";
document.getElementById("loginForm").style.display="block";
}

function handleRegister() {
    const name = document.querySelector('#registerForm input[type="text"]').value;
    const email = document.querySelectorAll('#registerForm input[type="email"]')[0].value;
    const password = document.querySelectorAll('#registerForm input[type="password"]')[0].value;
    const confirmPassword = document.querySelectorAll('#registerForm input[type="password"]')[1].value;
    
    if(!name || !email || !password || !confirmPassword) {
        alert('Please fill in all fields!');
        return;
    }
    
    if(password !== confirmPassword) {
        alert('Passwords do not match!');
        return;
    }
    
    if(password.length < 6) {
        alert('Password must be at least 6 characters!');
        return;
    }
    
    alert('Registration successful!\n\nWelcome, ' + name + '!\nYou can now login with your credentials.');
    showLogin();
}

</script>

</body>
</html>
